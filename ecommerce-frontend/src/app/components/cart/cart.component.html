<div class="container">
  <h2>Shopping Cart</h2>
  
  <div class="card mb-4">
    <div class="card-header">Add Item to Cart</div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4">
          <select class="form-select" [(ngModel)]="selectedProductId">
            <option value="">Select Product</option>
            <option *ngFor="let product of products" [value]="product.id">
              {{ product.name }} - ${{ product.price }}
            </option>
          </select>
        </div>
        <div class="col-md-3">
          <input type="number" class="form-control" [(ngModel)]="quantity" min="1" placeholder="Quantity">
        </div>
        <div class="col-md-3">
          <button class="btn btn-primary" (click)="addItem()" [disabled]="!selectedProductId || quantity < 1">
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      Cart Items (Total: ${{ cart.totalPrice || 0 }})
    </div>
    <div class="card-body">
      <div *ngIf="!cart?.items || cart.items.length === 0" class="alert alert-info">
        Your cart is empty.
      </div>
      
      <div *ngFor="let item of cart?.items" class="border p-3 mb-2">
        <div class="row align-items-center">
          <div class="col-md-4">
            <strong>{{ item.productName }}</strong>
          </div>
          <div class="col-md-2">${{ item.price }}</div>
          <div class="col-md-2">
            <input type="number" class="form-control" 
                   [value]="item.quantity" 
                   (change)="updateQuantity(item.productId, $any($event.target).value)"
                   min="1">
          </div>
          <div class="col-md-2">${{ item.price * item.quantity }}</div>
          <div class="col-md-2">
            <button class="btn btn-danger btn-sm" (click)="removeItem(item.productId)">
              Remove
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="cart?.items && cart.items.length > 0" class="mt-3">
        <div class="d-flex justify-content-between align-items-center">
          <h5>Total: ${{ cart.totalPrice }}</h5>
          <button class="btn btn-success" (click)="checkout()">Checkout</button>
        </div>
      </div>
    </div>
  </div>
</div>
