<div class="container text-center mt-5">
  <h1>Welcome to E-Commerce Frontend</h1>
  <p class="lead">Select a section to get started:</p>
  <div class="row mt-4 justify-content-center">
    <div class="col-md-2 mb-3">
      <a routerLink="/users" class="btn btn-primary btn-lg w-100">Users</a>
    </div>
    <div class="col-md-2 mb-3">
      <a routerLink="/products" class="btn btn-success btn-lg w-100">Products</a>
    </div>
    <div class="col-md-2 mb-3">
      <a routerLink="/cart" class="btn btn-info btn-lg w-100">Cart</a>
    </div>
    
    <!-- Only show Orders button if user has checked out -->
    <div *ngIf="hasCheckedOut" class="col-md-2 mb-3">
      <a routerLink="/orders" class="btn btn-warning btn-lg w-100">Orders</a>
    </div>
    
    <div class="col-md-2 mb-3">
      <a routerLink="/payments" class="btn btn-danger btn-lg w-100">Payments</a>
    </div>
  </div>
  
  <!-- Message for users who haven't checked out yet -->
  <div *ngIf="!hasCheckedOut" class="alert alert-info mt-4">
    <i class="bi bi-info-circle me-2"></i>
    <strong>Want to see your orders?</strong> Add items to your cart and complete checkout to unlock the Orders section!
  </div>
</div>
